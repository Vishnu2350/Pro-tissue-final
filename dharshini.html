<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ஒரு சிறிய கடிதம் — Dharshini</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep: #120c08;
    --bark: #2b1c12;
    --bark-light: #3c2a1a;
    --gold: #d9b26a;
    --gold-soft: #e8d3a0;
    --gold-dim: rgba(217,178,106,0.35);
    --cream: #f4ead8;
    --shadow: rgba(0,0,0,0.55);
  }

  *{ box-sizing: border-box; }

  a, a:visited, a:hover, a:active{
    color: inherit;
    text-decoration: none;
  }
  .card, .card *{
    text-decoration: none !important;
  }

  html,body{
    margin:0; padding:0; min-height:100%;
    background:
      radial-gradient(ellipse at 20% -10%, #241812 0%, transparent 55%),
      radial-gradient(ellipse at 80% 110%, #1a120c 0%, transparent 55%),
      var(--bg-deep);
    font-family: 'Cormorant Garamond', serif;
    color: var(--cream);
  }

  .stage{
    min-height:100vh;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 56px 20px 72px;
  }

  .eyebrow{
    letter-spacing: 0.35em;
    text-transform: uppercase;
    font-size: 12px;
    color: var(--gold-dim);
    margin-bottom: 10px;
    font-family: 'Cormorant Garamond', serif;
  }

  h1.title{
    font-family: 'Noto Sans Tamil', serif;
    font-weight: 600;
    font-size: clamp(26px, 4vw, 40px);
    color: var(--gold-soft);
    margin: 0 0 6px;
    text-align:center;
  }

  p.subtitle{
    font-style: italic;
    font-size: 17px;
    color: rgba(244,234,216,0.65);
    margin: 0 0 46px;
    text-align:center;
  }

  .deck{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    width: 100%;
    max-width: 900px;
  }

  .card{
    position:relative;
    border-radius: 18px;
    cursor:pointer;
    overflow:hidden;
    aspect-ratio: 3/4;
    box-shadow: 0 18px 40px var(--shadow), 0 2px 0 rgba(255,255,255,0.02) inset;
    transition: transform .45s cubic-bezier(.2,.8,.2,1), box-shadow .45s ease;
    isolation:isolate;
  }

  .card:hover{
    transform: translateY(-10px) rotate(-0.4deg);
    box-shadow: 0 30px 60px var(--shadow), 0 2px 0 rgba(255,255,255,0.03) inset;
  }

  .card:focus-visible{
    outline: 2px solid var(--gold-soft);
    outline-offset: 4px;
  }

  /* ---------- Book card ---------- */
  .book{
    background:
      radial-gradient(140% 90% at 15% 0%, #3a2818 0%, transparent 60%),
      linear-gradient(150deg, #2f2013 0%, #211609 60%, #170f07 100%);
    border: 1px solid var(--gold-dim);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 26px 20px;
    text-align:center;
  }

  .book::before{
    content:"";
    position:absolute;
    inset: 14px;
    border: 1px solid var(--gold-dim);
    border-radius: 8px;
    pointer-events:none;
  }
  .book::after{
    content:"";
    position:absolute;
    inset: 14px;
    border-radius: 8px;
    background:
      linear-gradient(120deg, rgba(255,255,255,0.05), transparent 40%);
    pointer-events:none;
  }

  .corner{
    position:absolute;
    width: 26px; height: 26px;
    border-top: 1px solid var(--gold);
    border-left: 1px solid var(--gold);
    opacity: 0.85;
  }
  .corner.tl{ top:22px; left:22px; }
  .corner.tr{ top:22px; right:22px; border-left:none; border-right:1px solid var(--gold); }
  .corner.bl{ bottom:22px; left:22px; border-top:none; border-bottom:1px solid var(--gold); }
  .corner.br{ bottom:22px; right:22px; border-top:none; border-left:none; border-bottom:1px solid var(--gold); border-right:1px solid var(--gold); }

  .book-tamil{
    font-family: 'Noto Sans Tamil', serif;
    font-weight: 600;
    font-size: clamp(24px, 5.5vw, 34px);
    color: var(--gold-soft);
    margin: 0;
    letter-spacing: 0.01em;
  }

  .book-eng{
    font-style: italic;
    font-size: 14px;
    color: rgba(244,234,216,0.55);
    margin: 8px 0 22px;
    letter-spacing: 0.06em;
  }

  .book-rule{
    width: 70px;
    height: 1px;
    background: var(--gold-dim);
    margin: 0 0 26px;
  }

  .book-name{
    font-family: 'Dancing Script', cursive;
    font-weight: 700;
    font-size: clamp(28px, 6vw, 38px);
    color: var(--gold-soft);
    margin: 0;
  }

  .book-hint{
    position:absolute;
    bottom: 24px;
    left: 28px;
    font-family: 'Noto Sans Tamil', serif;
    font-size: 13px;
    color: rgba(244,234,216,0.55);
  }

  .badge{
    position:absolute;
    bottom: 18px;
    right: 18px;
    width: 40px; height: 40px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #b3444a, #7d2a2e);
    display:flex; align-items:center; justify-content:center;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 17px;
    color: var(--cream);
    box-shadow: 0 6px 14px rgba(0,0,0,0.5);
  }

  /* ---------- Image card ---------- */
  .photo{
    border: 1px solid var(--gold-dim);
    background: #000;
  }
  .photo img{
    width:100%; height:100%;
    object-fit: cover;
    display:block;
    transition: transform .6s ease, filter .6s ease;
    filter: saturate(0.95) brightness(0.92);
  }
  .card:hover .photo img{
    transform: scale(1.06);
    filter: saturate(1.05) brightness(1);
  }

  .photo .veil{
    position:absolute;
    inset:0;
    background: linear-gradient(to top, rgba(10,6,3,0.85) 0%, rgba(10,6,3,0.05) 45%, transparent 65%);
    pointer-events:none;
  }

  .photo-caption{
    position:absolute;
    left: 22px; right: 22px; bottom: 20px;
    z-index: 2;
  }

  .photo-caption .eyebrow2{
    font-family: 'Cormorant Garamond', serif;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    font-size: 11px;
    color: var(--gold-dim);
    margin-bottom: 4px;
  }

  .photo-caption h3{
    font-family: 'Noto Sans Tamil', serif;
    font-weight: 600;
    font-size: 20px;
    color: var(--gold-soft);
    margin: 0 0 2px;
  }

  .photo-caption p{
    font-style: italic;
    font-size: 13px;
    color: rgba(244,234,216,0.75);
    margin: 0;
  }

  .arrow{
    position:absolute;
    top: 18px; right: 18px;
    width: 36px; height: 36px;
    border-radius: 50%;
    background: rgba(20,13,8,0.55);
    border: 1px solid var(--gold-dim);
    display:flex; align-items:center; justify-content:center;
    color: var(--gold-soft);
    font-size: 16px;
    backdrop-filter: blur(3px);
    transition: transform .4s ease, background .4s ease;
    z-index:2;
  }
  .card:hover .arrow{
    transform: translate(3px,-3px);
    background: rgba(20,13,8,0.8);
  }

  footer{
    margin-top: 44px;
    font-size: 12px;
    letter-spacing: 0.15em;
    color: rgba(244,234,216,0.35);
    text-transform: uppercase;
  }

  @media (max-width: 620px){
    .deck{
      grid-template-columns: 1fr;
      max-width: 340px;
      gap: 30px;
    }
    .card{ aspect-ratio: 4/5; }
  }

  @media (prefers-reduced-motion: reduce){
    .card, .photo img, .arrow{ transition: none !important; }
  }
</style>
</head>
